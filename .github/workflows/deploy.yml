name: Deploy to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::988787367176:role/cloud-resume-github-deploy
        aws-region: us-west-2

    - name: Sync to S3
      run: |
        aws s3 sync ./frontend s3://jessicaparadise.com --delete --exclude ".git/*" --exclude ".github/*"

    - name: Invalidate CloudFront
      run: |
        aws cloudfront create-invalidation --distribution-id E10G2LJT15ZAYN --paths "/*"